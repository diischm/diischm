<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Palette: #02070A midnight / #FC734D cantaloupe / #0297DE electric -->
    <clipPath id="frame"><rect width="800" height="240" rx="18"/></clipPath>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
    </filter>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#02070A" stop-opacity="0"/>
      <stop offset="1" stop-color="#02070A" stop-opacity="0.75"/>
    </radialGradient>

    <!-- name gradient, slowly sliding -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#FC734D"/>
      <stop offset="0.35" stop-color="#FFB07A"/>
      <stop offset="0.65" stop-color="#0297DE"/>
      <stop offset="1" stop-color="#FC734D"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-400 0;200 0;-400 0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </linearGradient>

    <!-- rise-in masks -->
    <clipPath id="nameClip"><rect x="0" y="40" width="800" height="104"/></clipPath>
    <clipPath id="tagClip"><rect x="0" y="150" width="800" height="40"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="240" fill="#02070A"/>

    <!-- ===== Blobs (fast, morphing) ===== -->
    <g filter="url(#blur)">
      <ellipse cx="400" cy="230" rx="260" ry="110" fill="#FC734D" opacity="0.9">
        <animate attributeName="cx" values="400;250;520;400" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="230;190;215;230" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="rx" values="260;200;300;260" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="ry" values="110;140;95;110" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
      </ellipse>
      <ellipse cx="130" cy="200" rx="150" ry="90" fill="#FF9A5C" opacity="0.6">
        <animate attributeName="cx" values="130;260;90;130" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="200;150;230;200" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="rx" values="150;110;180;150" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="40" rx="170" ry="110" fill="#0297DE" opacity="0.55">
        <animate attributeName="cx" values="700;560;760;700" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="40;100;20;40" dur="6.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="ry" values="110;80;130;110" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="660" cy="230" rx="140" ry="80" fill="#C2401F" opacity="0.75">
        <animate attributeName="cx" values="660;540;720;660" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="230;200;240;230" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- soft wave sweeping along the bottom -->
    <g opacity="0.35" filter="url(#blur)">
      <path fill="#FC734D" d="M0 210 C 100 170 200 250 300 210 C 400 170 500 250 600 210 C 700 170 800 250 900 210 C 1000 170 1100 250 1200 210 C 1300 170 1400 250 1500 210 C 1600 170 1700 250 1800 210 L1800 260 L0 260Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect width="800" height="240" fill="url(#vignette)"/>
    <rect width="800" height="240" filter="url(#grain)"/>

    <!-- ===== Name: rises in, gradient slides ===== -->
    <g clip-path="url(#nameClip)">
      <text x="400" y="122" text-anchor="middle" font-size="68" font-weight="800" letter-spacing="-3" fill="url(#nameGrad)">
        Dimitar Karadjovski
        <animate attributeName="y" values="200;122" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </text>
    </g>

    <!-- ===== Tagline: fades up ===== -->
    <g clip-path="url(#tagClip)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze"/>
      <text x="400" y="176" text-anchor="middle" font-size="19" font-weight="600" fill="#F4F7F9" fill-opacity="0.65">
        DevOps   ·   Security   ·   Infrastructure
        <animate attributeName="y" values="196;176" dur="0.9s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </text>
    </g>
  </g>
</svg>
